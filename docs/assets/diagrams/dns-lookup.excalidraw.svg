<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 380" width="1240" height="380" role="img" aria-label="How the resolver answers a lookup: an IP or localhost is answered at once; otherwise the DNS rules pick a server, the cache answers if it can, and on a miss the server's module sends one wire message over the server's own outbound. The answer is filtered by ip_versions, cached for its TTL and returned.">
