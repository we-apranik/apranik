<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>How the resolver answers a lookup</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1240" height="380" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="240" y="20" width="740" height="340" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="254" y="42" font-size="14" font-weight="bold" fill="#495057">The resolver</text>
<rect x="20" y="140" width="190" height="110" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="115.0" y="175.8" font-size="12" text-anchor="middle"><tspan x="115.0" dy="0.0" font-weight="bold">A lookup</tspan><tspan x="115.0" dy="15.6">freedom dialing a name,</tspan><tspan x="115.0" dy="15.6">a proxy reaching its server,</tspan><tspan x="115.0" dy="15.6">a resolve action</tspan></text>
<rect x="260" y="60" width="170" height="80" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="345.0" y="96.4" font-size="12" text-anchor="middle"><tspan x="345.0" dy="0.0" font-weight="bold">IP or localhost?</tspan><tspan x="345.0" dy="15.6">answered at once</tspan></text>
<rect x="460" y="60" width="200" height="80" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="560.0" y="88.6" font-size="12" text-anchor="middle"><tspan x="560.0" dy="0.0" font-weight="bold">DNS rules</tspan><tspan x="560.0" dy="15.6">first match picks a server;</tspan><tspan x="560.0" dy="15.6">else default_server</tspan></text>
<rect x="690" y="60" width="270" height="80" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/><text x="825.0" y="88.6" font-size="12" text-anchor="middle"><tspan x="825.0" dy="0.0" font-weight="bold">Cache</tspan><tspan x="825.0" dy="15.6">a fresh answer is returned</tspan><tspan x="825.0" dy="15.6">(serve_stale: an old one too)</tspan></text>
<rect x="690" y="220" width="270" height="110" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="825.0" y="255.8" font-size="12" text-anchor="middle"><tspan x="825.0" dy="0.0" font-weight="bold">The server module</tspan><tspan x="825.0" dy="15.6">udp · tcp · dot · doh · system</tspan><tspan x="825.0" dy="15.6">sends one message over</tspan><tspan x="825.0" dy="15.6">the server's own outbound</tspan></text>
<rect x="260" y="240" width="400" height="70" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="460.0" y="279.2" font-size="12" text-anchor="middle"><tspan x="460.0" dy="0.0" font-weight="bold">Answer: filtered by ip_versions, cached for its TTL</tspan></text>
<rect x="1010" y="220" width="200" height="110" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="1110.0" y="263.6" font-size="12" text-anchor="middle"><tspan x="1110.0" dy="0.0" font-weight="bold">Upstream resolver</tspan><tspan x="1110.0" dy="15.6">through freedom, fragment</tspan><tspan x="1110.0" dy="15.6">or the proxy</tspan></text>
