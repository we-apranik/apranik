<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>The three proxy shapes</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1240" height="520" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="20" y="20" width="390" height="400" rx="14" fill="#ebfbee" stroke="#495057" stroke-width="1.5"/>
<text x="34" y="42" font-size="14" font-weight="bold" fill="#495057">StreamProxy</text>
<rect x="425" y="20" width="390" height="400" rx="14" fill="#ebfbee" stroke="#495057" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="439" y="42" font-size="14" font-weight="bold" fill="#495057">DatagramOverStreamProxy</text>
<rect x="830" y="20" width="390" height="400" rx="14" fill="#ebfbee" stroke="#495057" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="844" y="42" font-size="14" font-weight="bold" fill="#495057">DatagramProxy</text>
<polyline points="215.0,310 215.0,270" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="215.0,180 215.0,140" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="620.0,310 620.0,270" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="620.0,180 620.0,140" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="1025.0,310 1025.0,270" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="1025.0,180 1025.0,140" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<rect x="50" y="70" width="330" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="215.0" y="100.5" text-anchor="middle" font-size="15" font-weight="bold">payload: Stream</text>
<text x="215.0" y="118.3" text-anchor="middle" font-size="13">what the proxy returns upward</text>
<rect x="50" y="180" width="330" height="90" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="215.0" y="212.8" text-anchor="middle" font-size="14" font-weight="bold">StreamProxy</text>
<text x="215.0" y="229.2" text-anchor="middle" font-size="12">server: Accept... (reads the request)</text>
<text x="215.0" y="245.4" text-anchor="middle" font-size="12">client: Connect... (writes it)</text>
<rect x="50" y="310" width="330" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="215.0" y="340.5" text-anchor="middle" font-size="15" font-weight="bold">carrier: Stream</text>
<text x="215.0" y="358.3" text-anchor="middle" font-size="13">handed over by the transport stack</text>
<rect x="455" y="70" width="330" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="620.0" y="100.5" text-anchor="middle" font-size="15" font-weight="bold">payload: Datagram</text>
<text x="620.0" y="118.3" text-anchor="middle" font-size="13">what the proxy returns upward</text>
<rect x="455" y="180" width="330" height="90" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 6"/>
<text x="620.0" y="212.8" text-anchor="middle" font-size="14" font-weight="bold">DatagramOverStreamProxy</text>
<text x="620.0" y="229.2" text-anchor="middle" font-size="12">server: Accept... (reads the request)</text>
<text x="620.0" y="245.4" text-anchor="middle" font-size="12">client: Connect... (writes it)</text>
<rect x="455" y="310" width="330" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="620.0" y="340.5" text-anchor="middle" font-size="15" font-weight="bold">carrier: Stream</text>
<text x="620.0" y="358.3" text-anchor="middle" font-size="13">handed over by the transport stack</text>
<rect x="860" y="70" width="330" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="1025.0" y="100.5" text-anchor="middle" font-size="15" font-weight="bold">payload: Datagram</text>
<text x="1025.0" y="118.3" text-anchor="middle" font-size="13">what the proxy returns upward</text>
<rect x="860" y="180" width="330" height="90" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1025.0" y="212.8" text-anchor="middle" font-size="14" font-weight="bold">DatagramProxy</text>
<text x="1025.0" y="229.2" text-anchor="middle" font-size="12">server: Accept... (reads the request)</text>
<text x="1025.0" y="245.4" text-anchor="middle" font-size="12">client: Connect... (writes it)</text>
<rect x="860" y="310" width="330" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="1025.0" y="340.5" text-anchor="middle" font-size="15" font-weight="bold">carrier: Datagram</text>
<text x="1025.0" y="358.3" text-anchor="middle" font-size="13">handed over by the transport stack</text>
<text x="215" y="450.0" text-anchor="middle" font-size="12" font-style="italic" fill="#495057">SOCKS5 CONNECT, HTTP CONNECT</text>
<text x="215" y="466.8" text-anchor="middle" font-size="12" font-style="italic" fill="#495057">(implemented)</text>
<text x="620" y="450.0" text-anchor="middle" font-size="12" font-style="italic" fill="#495057">VLESS or Trojan UDP,</text>
<text x="620" y="466.8" text-anchor="middle" font-size="12" font-style="italic" fill="#495057">UDP over a TCP/TLS stream (none yet)</text>
<text x="1025" y="450.0" text-anchor="middle" font-size="12" font-style="italic" fill="#495057">Shadowsocks UDP</text>
<text x="1025" y="466.8" text-anchor="middle" font-size="12" font-style="italic" fill="#495057">(none yet)</text>
<text x="20" y="505.0" text-anchor="start" font-size="12" fill="#1e1e1e">Carrier and payload are independent, so there are three shapes, not one. One shape for everything would either lose message boundaries or lose the compiler&#x27;s help.</text>
</g></svg>
