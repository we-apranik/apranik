<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="1180" height="400" role="img" aria-label="The three proxy shapes: StreamProxyModule takes an underlying Stream and returns a Stream (SOCKS5, HTTP, Trojan and VLESS TCP); DatagramOverStreamProxyModule takes a Stream and returns a Datagram (Trojan UDP, VLESS UDP and XUDP); DatagramProxyModule takes a Datagram and returns a Datagram (none yet).">
