<rect x="0" y="0" width="1180" height="300" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="230" y="20" width="730" height="260" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="244" y="42" font-size="14" font-weight="bold" fill="#495057">apranik run -config config.json</text>
<rect x="20" y="100" width="170" height="80" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="105.0" y="128.6" font-size="12" text-anchor="middle"><tspan x="105.0" dy="0.0" font-weight="bold">Your app</tspan><tspan x="105.0" dy="15.6">curl or a browser</tspan><tspan x="105.0" dy="15.6">SOCKS5 or HTTP</tspan></text>
<rect x="250" y="80" width="210" height="150" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="355.0" y="128.0" font-size="12" text-anchor="middle"><tspan x="355.0" dy="0.0" font-weight="bold">inbounds[0] "local"</tspan><tspan x="355.0" dy="15.6">127.0.0.1:1080 · tcp</tspan><tspan x="355.0" dy="15.6">mixed: first byte 0x05</tspan><tspan x="355.0" dy="15.6">is SOCKS5, anything else</tspan><tspan x="355.0" dy="15.6">is HTTP</tspan></text>
<rect x="490" y="100" width="200" height="110" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5"/><text x="590.0" y="135.8" font-size="12" text-anchor="middle"><tspan x="590.0" dy="0.0" font-weight="bold">routing</tspan><tspan x="590.0" dy="15.6">none written, so the</tspan><tspan x="590.0" dy="15.6">first outbound is</tspan><tspan x="590.0" dy="15.6">the default</tspan></text>
<rect x="720" y="80" width="220" height="150" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="830.0" y="135.8" font-size="12" text-anchor="middle"><tspan x="830.0" dy="0.0" font-weight="bold">outbounds[0] "direct"</tspan><tspan x="830.0" dy="15.6">freedom</tspan><tspan x="830.0" dy="15.6">connects straight to</tspan><tspan x="830.0" dy="15.6">each destination</tspan></text>
<rect x="1000" y="100" width="160" height="80" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="1080.0" y="136.4" font-size="12" text-anchor="middle"><tspan x="1080.0" dy="0.0" font-weight="bold">Destination</tspan><tspan x="1080.0" dy="15.6">example.com:443</tspan></text>
