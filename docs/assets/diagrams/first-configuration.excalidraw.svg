<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" role="img" aria-label="A request through the first configuration: an app sends SOCKS5 or HTTP to the local inbound on 127.0.0.1:1080, which tells the two apart by the first byte. With no routing section the first outbound is the default, freedom, which connects straight to the destination.">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>A request through the first configuration</title>
