<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 380" width="1260" height="380" role="img" aria-label="A client and a server: an app on the user's device talks SOCKS5 or HTTP to the local apranik client, whose outbound is a Trojan proxy over TLS. Across the censored network a DPI box sees only a TLS connection to the server's name. On the server, an apranik inbound with the Trojan protocol over TLS passes the request to freedom, which connects to the real destination.">
