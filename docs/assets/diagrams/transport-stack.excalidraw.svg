<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 380" width="1180" height="380" role="img" aria-label="How a transport stack is built: an outbound's list, such as tcp, tls, ws, is dialed in order: tcp opens the connection, tls wraps it, ws wraps that, and the proxy protocol sends its request over the result. An inbound with the same list accepts in the same order and its proxy protocol reads the request.">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>How a transport stack is built</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1180" height="380" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="20" y="20" width="560" height="340" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="34" y="42" font-size="14" font-weight="bold" fill="#495057">Outbound: written top to bottom, dialed in that order</text>
<rect x="600" y="20" width="560" height="340" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="614" y="42" font-size="14" font-weight="bold" fill="#495057">Inbound: the same list, accepted in the same order</text>
<rect x="40" y="70" width="300" height="60" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="190.0" y="96.4" font-size="12" text-anchor="middle"><tspan x="190.0" dy="0.0" font-weight="bold">{ "type": "tcp" }</tspan><tspan x="190.0" dy="15.6">opens the connection</tspan></text>
<rect x="40" y="150" width="300" height="60" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="190.0" y="176.4" font-size="12" text-anchor="middle"><tspan x="190.0" dy="0.0" font-weight="bold">{ "type": "tls" }</tspan><tspan x="190.0" dy="15.6">wraps it in TLS</tspan></text>
<polyline points="190,130 190,150" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="40" y="230" width="300" height="60" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="190.0" y="256.4" font-size="12" text-anchor="middle"><tspan x="190.0" dy="0.0" font-weight="bold">{ "type": "ws" }</tspan><tspan x="190.0" dy="15.6">wraps that in WebSocket</tspan></text>
<polyline points="190,210 190,230" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="380" y="150" width="180" height="60" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="470.0" y="176.4" font-size="12" text-anchor="middle"><tspan x="470.0" dy="0.0" font-weight="bold">proxy protocol</tspan><tspan x="470.0" dy="15.6">sends its request</tspan></text>
<polyline points="340,260 470,210" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<text x="40" y="331" font-size="11" text-anchor="start" fill="#495057"><tspan x="40" dy="0.0">base first; each overlay wraps the one before</tspan></text>
<rect x="620" y="70" width="300" height="60" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="770.0" y="96.4" font-size="12" text-anchor="middle"><tspan x="770.0" dy="0.0" font-weight="bold">tcp</tspan><tspan x="770.0" dy="15.6">accepts the connection</tspan></text>
<rect x="620" y="150" width="300" height="60" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="770.0" y="176.4" font-size="12" text-anchor="middle"><tspan x="770.0" dy="0.0" font-weight="bold">tls</tspan><tspan x="770.0" dy="15.6">answers the TLS handshake</tspan></text>
<polyline points="770,130 770,150" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="620" y="230" width="300" height="60" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="770.0" y="256.4" font-size="12" text-anchor="middle"><tspan x="770.0" dy="0.0" font-weight="bold">ws</tspan><tspan x="770.0" dy="15.6">answers the upgrade</tspan></text>
<polyline points="770,210 770,230" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="960" y="150" width="180" height="60" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="1050.0" y="176.4" font-size="12" text-anchor="middle"><tspan x="1050.0" dy="0.0" font-weight="bold">proxy protocol</tspan><tspan x="1050.0" dy="15.6">reads the request</tspan></text>
<polyline points="920,260 1050,210" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<text x="620" y="331" font-size="11" text-anchor="start" fill="#495057"><tspan x="620" dy="0.0">each layer bounds its own handshake</tspan></text>
</g>
</svg>
