<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="What each top-level key of the config file does: a connection arrives on an inbound, routing picks an outbound by its rules, and the outbound sends it to the network. Datasets and dns are looked up along the way. log, stats and apis concern the running core.">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>What each top-level key of the config file does</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1180" height="430" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="20" y="20" width="1140" height="190" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="34" y="42" font-size="14" font-weight="bold" fill="#495057">The path of every connection</text>
<rect x="20" y="230" width="740" height="180" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/><text x="34" y="252" font-size="14" font-weight="bold" fill="#495057">Looked up along the way</text>
<rect x="780" y="230" width="380" height="180" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/><text x="794" y="252" font-size="14" font-weight="bold" fill="#495057">The running core</text>
<rect x="40" y="70" width="230" height="110" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="155.0" y="113.6" font-size="12" text-anchor="middle"><tspan x="155.0" dy="0.0" font-weight="bold">inbounds</tspan><tspan x="155.0" dy="15.6">listen, transport stack,</tspan><tspan x="155.0" dy="15.6">protocol and its users</tspan></text>
<rect x="320" y="70" width="230" height="110" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="435.0" y="113.6" font-size="12" text-anchor="middle"><tspan x="435.0" dy="0.0" font-weight="bold">routing</tspan><tspan x="435.0" dy="15.6">rules in order;</tspan><tspan x="435.0" dy="15.6">first decision wins</tspan></text>
<rect x="600" y="70" width="230" height="110" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="715.0" y="113.6" font-size="12" text-anchor="middle"><tspan x="715.0" dy="0.0" font-weight="bold">outbounds</tspan><tspan x="715.0" dy="15.6">proxies, freedom</tspan><tspan x="715.0" dy="15.6">and groups</tspan></text>
<rect x="880" y="70" width="250" height="110" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="1005.0" y="113.6" font-size="12" text-anchor="middle"><tspan x="1005.0" dy="0.0" font-weight="bold">The network</tspan><tspan x="1005.0" dy="15.6">direct, or through</tspan><tspan x="1005.0" dy="15.6">a server</tspan></text>
<polyline points="270,125 320,125" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="550,125 600,125" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="830,125 880,125" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="40" y="280" width="320" height="100" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/><text x="200.0" y="318.6" font-size="12" text-anchor="middle"><tspan x="200.0" dy="0.0" font-weight="bold">datasets</tspan><tspan x="200.0" dy="15.6">named domain or IP lists</tspan><tspan x="200.0" dy="15.6">read from geosite and geoip files</tspan></text>
<rect x="420" y="280" width="320" height="100" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/><text x="580.0" y="318.6" font-size="12" text-anchor="middle"><tspan x="580.0" dy="0.0" font-weight="bold">dns</tspan><tspan x="580.0" dy="15.6">the resolver: every domain</tspan><tspan x="580.0" dy="15.6">lookup goes through it</tspan></text>
<text x="800" y="282" font-size="12" text-anchor="start"><tspan x="800" dy="0.0">log: where records go</tspan><tspan x="800" dy="15.6">stats: what is counted</tspan><tspan x="800" dy="15.6">apis: read and control it from</tspan><tspan x="800" dy="15.6">another program</tspan></text>
</g>
</svg>
