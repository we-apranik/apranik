<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 570" width="1260" height="570" role="img" aria-label="How the mixed inbound protocol dispatches a connection">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>How the mixed inbound protocol dispatches a connection</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect x="0" y="0" width="1260" height="570" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="210" y="20" width="800" height="420" rx="14" fill="#ebfbee" stroke="#495057" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="224" y="42" font-size="14" font-weight="bold" fill="#495057">one inbound with protocol { type: &quot;mixed&quot; }</text>
<polyline points="180,230 230,230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="430,230 470,230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="710,200 735,200 735,160 760,160" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="710,260 735,260 735,340 760,340" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="990,160 1020,160 1020,215 1050,215" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="990,340 1020,340 1020,245 1050,245" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="875,100 875,75 330,75 330,170" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#h1)"/>
<rect x="30" y="190" width="150" height="80" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="105.0" y="225.8" text-anchor="middle" font-size="13" font-weight="bold">client</text>
<text x="105.0" y="242.0" text-anchor="middle" font-size="12">SOCKS5 or HTTP</text>
<rect x="230" y="170" width="200" height="120" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="330.0" y="209.6" text-anchor="middle" font-size="13" font-weight="bold">accept loop</text>
<text x="330.0" y="225.8" text-anchor="middle" font-size="12">handshake timeout</text>
<text x="330.0" y="242.0" text-anchor="middle" font-size="12">recording for fallback</text>
<text x="330.0" y="258.2" text-anchor="middle" font-size="12">sniffing after the handshake</text>
<rect x="470" y="160" width="240" height="140" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="590.0" y="201.5" text-anchor="middle" font-size="13" font-weight="bold">core/inbound/mixed</text>
<text x="590.0" y="217.7" text-anchor="middle" font-size="12">PeekExactly(1)</text>
<text x="590.0" y="233.9" text-anchor="middle" font-size="12">0x05 → SOCKS5 server</text>
<text x="590.0" y="250.1" text-anchor="middle" font-size="12">anything else → HTTP server</text>
<text x="590.0" y="266.3" text-anchor="middle" font-size="12">forwards UDPAssociateHandler</text>
<rect x="760" y="100" width="230" height="120" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="875.0" y="139.6" text-anchor="middle" font-size="13" font-weight="bold">socks5 module</text>
<text x="875.0" y="155.8" text-anchor="middle" font-size="12">CONNECT → payload stream</text>
<text x="875.0" y="172.0" text-anchor="middle" font-size="12">UDP ASSOCIATE →</text>
<text x="875.0" y="188.2" text-anchor="middle" font-size="12">ErrUDPAssociationRequested</text>
<rect x="760" y="290" width="230" height="100" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="875.0" y="327.7" text-anchor="middle" font-size="13" font-weight="bold">http module</text>
<text x="875.0" y="343.9" text-anchor="middle" font-size="12">CONNECT or absolute-form</text>
<text x="875.0" y="360.1" text-anchor="middle" font-size="12">→ payload stream</text>
<rect x="1050" y="190" width="180" height="80" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="1140.0" y="225.8" text-anchor="middle" font-size="13" font-weight="bold">handler</text>
<text x="1140.0" y="242.0" text-anchor="middle" font-size="12">route · dial · relay</text>
<text x="716" y="150" font-size="12" font-weight="bold" fill="#495057">0x05</text>
<text x="716" y="360" font-size="12" font-weight="bold" fill="#495057">other</text>
<text x="345" y="98" font-size="12" font-weight="bold" fill="#c92a2a">UDP ASSOCIATE: Associate on core&#x27;s own carrier, forwarded by mixed</text>
<text x="230" y="477.0" text-anchor="start" font-size="12" font-style="italic" fill="#495057">PeekExactly(1) never reads past the byte it needs, so nothing stays</text>
<text x="230" y="493.8" text-anchor="start" font-size="12" font-style="italic" fill="#495057">buffered in mixed&#x27;s peekable wrapper. That matters because core calls</text>
<text x="230" y="510.6" text-anchor="start" font-size="12" font-style="italic" fill="#495057">Associate with its own carrier, not the wrapper: a byte read ahead</text>
<text x="230" y="527.4" text-anchor="start" font-size="12" font-style="italic" fill="#495057">would be lost from the SOCKS5 request.</text>
<text x="760" y="477.0" text-anchor="start" font-size="12" font-style="italic" fill="#495057">mixed is an ordinary StreamProxyServer, so the</text>
<text x="760" y="493.8" text-anchor="start" font-size="12" font-style="italic" fill="#495057">inbound&#x27;s fallback, sniffing and timeouts apply</text>
<text x="760" y="510.6" text-anchor="start" font-size="12" font-style="italic" fill="#495057">unchanged. socks5 and http keep their own</text>
<text x="760" y="527.4" text-anchor="start" font-size="12" font-style="italic" fill="#495057">settings and credentials.</text>
</g></svg>
