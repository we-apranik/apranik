<rect x="880" y="20" width="360" height="380" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="894" y="42" font-size="14" font-weight="bold" fill="#495057">Your server</text>
<rect x="40" y="70" width="260" height="60" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="170.0" y="96.4" font-size="12" text-anchor="middle"><tspan x="170.0" dy="0.0" font-weight="bold">App</tspan><tspan x="170.0" dy="15.6">SOCKS5 or HTTP to Apranik</tspan></text>
<rect x="40" y="170" width="260" height="170" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="170.0" y="228.0" font-size="12" text-anchor="middle"><tspan x="170.0" dy="0.0" font-weight="bold">Apranik client</tspan><tspan x="170.0" dy="15.6">outbound: trojan</tspan><tspan x="170.0" dy="15.6">over ws or httpupgrade</tspan><tspan x="170.0" dy="15.6">over tls (SNI cdn.example.com)</tspan><tspan x="170.0" dy="15.6">over tcp to a CDN address</tspan></text>
<polyline points="170,130 170,170" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
