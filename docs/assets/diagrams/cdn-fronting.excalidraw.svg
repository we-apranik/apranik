<rect x="900" y="260" width="320" height="60" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="1060.0" y="286.4" font-size="12" text-anchor="middle"><tspan x="1060.0" dy="0.0" font-weight="bold">freedom</tspan><tspan x="1060.0" dy="15.6">straight to each destination</tspan></text>
