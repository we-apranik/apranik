<title>Trojan over WebSocket or HTTPUpgrade behind a CDN</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<rect x="0" y="0" width="1300" height="560" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="20" y="20" width="300" height="400" rx="14" fill="#ebfbee" stroke="#495057" stroke-width="1.5" stroke-dasharray="7 5"/>
<text class="group-label" x="34" y="42" font-size="14" font-weight="bold" fill="#495057">Client device</text>
<rect x="350" y="20" width="250" height="400" rx="14" fill="#ebfbee" stroke="#495057" stroke-width="1.5" stroke-dasharray="7 5"/>
<text class="group-label" x="364" y="42" font-size="14" font-weight="bold" fill="#495057">Censored network</text>
<rect x="910" y="20" width="370" height="400" rx="14" fill="#ebfbee" stroke="#495057" stroke-width="1.5" stroke-dasharray="7 5"/>
<text class="group-label" x="924" y="42" font-size="14" font-weight="bold" fill="#495057">Server, reachable from the CDN</text>
<polyline points="170,140 170,180" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="300,285 370,225" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="580,225 640,225" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="870,200 930,175" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="1095,280 1095,310" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="1095,390 1095,450" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<rect x="40" y="70" width="260" height="70" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="170.0" y="100.5" text-anchor="middle" font-size="14" font-weight="bold">Client app</text>
<text x="170.0" y="118.0" text-anchor="middle" font-size="13">speaks SOCKS5 to Apranik</text>
<rect x="40" y="180" width="260" height="210" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="170.0" y="245.3" text-anchor="middle" font-size="14" font-weight="bold">Apranik client</text>
<text x="170.0" y="262.9" text-anchor="middle" font-size="13">outbound:</text>
<text x="170.0" y="280.4" text-anchor="middle" font-size="13">trojan</text>
<text x="170.0" y="298.0" text-anchor="middle" font-size="13">over ws or httpupgrade</text>
<text x="170.0" y="315.6" text-anchor="middle" font-size="13">over tls (SNI cdn.example)</text>
<text x="170.0" y="333.1" text-anchor="middle" font-size="13">over tcp to a CDN address</text>
<rect x="370" y="150" width="210" height="150" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="475.0" y="194.1" text-anchor="middle" font-size="14" font-weight="bold">Censor on path</text>
<text x="475.0" y="211.7" text-anchor="middle" font-size="13">sees: a CDN IP, TLS with</text>
<text x="475.0" y="229.2" text-anchor="middle" font-size="13">SNI cdn.example;</text>
<text x="475.0" y="246.8" text-anchor="middle" font-size="13">cannot see the path,</text>
<text x="475.0" y="264.3" text-anchor="middle" font-size="13">Host or payload</text>
<rect x="640" y="150" width="230" height="150" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="755.0" y="194.1" text-anchor="middle" font-size="14" font-weight="bold">CDN edge</text>
<text x="755.0" y="211.7" text-anchor="middle" font-size="13">ends TLS; routes on</text>
<text x="755.0" y="229.2" text-anchor="middle" font-size="13">Host and path; relays</text>
<text x="755.0" y="246.8" text-anchor="middle" font-size="13">the upgraded connection</text>
<text x="755.0" y="264.3" text-anchor="middle" font-size="13">both ways</text>
<rect x="930" y="70" width="330" height="210" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="1095.0" y="135.3" text-anchor="middle" font-size="14" font-weight="bold">Apranik server</text>
<text x="1095.0" y="152.9" text-anchor="middle" font-size="13">inbound:</text>
<text x="1095.0" y="170.4" text-anchor="middle" font-size="13">tcp (+ tls if the CDN</text>
<text x="1095.0" y="188.0" text-anchor="middle" font-size="13">connects to the origin over TLS)</text>
<text x="1095.0" y="205.6" text-anchor="middle" font-size="13">+ ws or httpupgrade (path, host)</text>
<text x="1095.0" y="223.1" text-anchor="middle" font-size="13">+ trojan (users, fallback)</text>
<rect x="930" y="310" width="330" height="80" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="1095.0" y="345.4" text-anchor="middle" font-size="14" font-weight="bold">freedom</text>
<text x="1095.0" y="363.0" text-anchor="middle" font-size="13">straight to each destination</text>
<rect x="930" y="450" width="330" height="70" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="1095.0" y="480.4" text-anchor="middle" font-size="14" font-weight="bold">Destinations</text>
<text x="1095.0" y="498.0" text-anchor="middle" font-size="13">the open internet</text>
<text x="20" y="462.0" text-anchor="start" font-size="12" font-style="italic" fill="#495057">What each layer does: tls hides the request from the censor; ws or httpupgrade makes it an HTTP upgrade the CDN</text>
<text x="20" y="478.8" text-anchor="start" font-size="12" font-style="italic" fill="#495057">will relay; trojan authenticates and names the real destination. The CDN terminates the outer TLS, so it sees the</text>
<text x="20" y="495.6" text-anchor="start" font-size="12" font-style="italic" fill="#495057">Trojan request: choose a CDN you are willing to trust with that. Behind the CDN, Metadata.Source is the CDN&#x27;s</text>
<text x="20" y="512.4" text-anchor="start" font-size="12" font-style="italic" fill="#495057">address (open question Q19).</text>
</g></svg>
