<rect x="630" y="170" width="220" height="170" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/><text x="740.0" y="235.8" font-size="12" text-anchor="middle"><tspan x="740.0" dy="0.0" font-weight="bold">CDN edge</tspan><tspan x="740.0" dy="15.6">ends TLS, routes on</tspan><tspan x="740.0" dy="15.6">Host and path, relays</tspan><tspan x="740.0" dy="15.6">the upgraded connection</tspan></text>
