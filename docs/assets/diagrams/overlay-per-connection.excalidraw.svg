<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 420" width="1260" height="420" role="img" aria-label="Stream overlays run per connection: the accept loop only accepts, takes a max_tcp_connections slot and starts a goroutine. That goroutine runs the tls and ws server sides and the proxy server, each within its own handshake_timeout, then the handler. A silent client holds only its own goroutine. Fallback replays what came through the overlays. On an outbound the same layers run after tcp dials.">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>Stream overlays run per connection</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1260" height="420" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="20" y="20" width="300" height="380" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="34" y="42" font-size="14" font-weight="bold" fill="#495057">The accept loop: one per inbound</text>
<rect x="340" y="20" width="900" height="380" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="354" y="42" font-size="14" font-weight="bold" fill="#495057">That connection's own goroutine</text>
<rect x="40" y="70" width="260" height="70" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="170.0" y="101.4" font-size="12" text-anchor="middle"><tspan x="170.0" dy="0.0" font-weight="bold">tcp listener</tspan><tspan x="170.0" dy="15.6">accepts a connection</tspan></text>
<rect x="40" y="170" width="260" height="70" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="170.0" y="201.4" font-size="12" text-anchor="middle"><tspan x="170.0" dy="0.0" font-weight="bold">max_tcp_connections</tspan><tspan x="170.0" dy="15.6">takes a slot, or closes at once</tspan></text>
<rect x="40" y="270" width="260" height="70" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="170.0" y="301.4" font-size="12" text-anchor="middle"><tspan x="170.0" dy="0.0" font-weight="bold">go handleStream</tspan><tspan x="170.0" dy="15.6">and straight back to accept</tspan></text>
<polyline points="170,140 170,170" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="170,240 170,270" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="40,305 30,305 30,105 40,105" fill="none" stroke="#495057" stroke-width="1" stroke-dasharray="5 5"/>
<rect x="360" y="70" width="190" height="90" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="455.0" y="95.8" font-size="12" text-anchor="middle"><tspan x="455.0" dy="0.0" font-weight="bold">tls</tspan><tspan x="455.0" dy="15.6">WrapServerStream</tspan><tspan x="455.0" dy="15.6">within its</tspan><tspan x="455.0" dy="15.6">handshake_timeout</tspan></text>
<rect x="580" y="70" width="190" height="90" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="675.0" y="95.8" font-size="12" text-anchor="middle"><tspan x="675.0" dy="0.0" font-weight="bold">ws</tspan><tspan x="675.0" dy="15.6">WrapServerStream</tspan><tspan x="675.0" dy="15.6">within its</tspan><tspan x="675.0" dy="15.6">handshake_timeout</tspan></text>
<rect x="800" y="70" width="190" height="90" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="895.0" y="95.8" font-size="12" text-anchor="middle"><tspan x="895.0" dy="0.0" font-weight="bold">trojan</tspan><tspan x="895.0" dy="15.6">AcceptStream</tspan><tspan x="895.0" dy="15.6">within its</tspan><tspan x="895.0" dy="15.6">handshake_timeout</tspan></text>
<rect x="1020" y="70" width="200" height="90" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="1120.0" y="111.4" font-size="12" text-anchor="middle"><tspan x="1120.0" dy="0.0" font-weight="bold">handler</tspan><tspan x="1120.0" dy="15.6">route and relay</tspan></text>
<polyline points="300,305 330,305 330,115 360,115" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="550,115 580,115" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="770,115 800,115" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="990,115 1020,115" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="360" y="210" width="410" height="70" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="565.0" y="241.4" font-size="12" text-anchor="middle"><tspan x="565.0" dy="0.0" font-weight="bold">A client that sends nothing</tspan><tspan x="565.0" dy="15.6">holds only its own goroutine and slot</tspan></text>
<rect x="800" y="210" width="420" height="70" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="1010.0" y="241.4" font-size="12" text-anchor="middle"><tspan x="1010.0" dy="0.0" font-weight="bold">Fallback replays what came through the overlays:</tspan><tspan x="1010.0" dy="15.6">the decrypted request, not TLS records</tspan></text>
<text x="360" y="322" font-size="12" text-anchor="start" fill="#495057"><tspan x="360" dy="0.0">A failed overlay handshake is closed and logged at debug. On an outbound the same layers run</tspan><tspan x="360" dy="15.6">in the same order after tcp dials, inside one dialer the builder made once.</tspan></text>
</g>
</svg>
