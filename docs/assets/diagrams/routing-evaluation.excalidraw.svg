<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" role="img" aria-label="How routing rules are evaluated: each rule in order is checked; if its match holds its action runs. route sends the request through an outbound and block refuses it, both ending the list. sniff learns the name the connection asks for and resolve looks up the domain's addresses; both go on to the next rule. A request no rule decided takes default_action.">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>How routing rules are evaluated</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1180" height="420" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="20" y="60" width="170" height="80" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="105.0" y="88.6" font-size="12" text-anchor="middle"><tspan x="105.0" dy="0.0" font-weight="bold">A request</tspan><tspan x="105.0" dy="15.6">network, destination,</tspan><tspan x="105.0" dy="15.6">source, inbound, user</tspan></text>
<rect x="230" y="60" width="190" height="80" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="325.0" y="88.6" font-size="12" text-anchor="middle"><tspan x="325.0" dy="0.0" font-weight="bold">Next rule</tspan><tspan x="325.0" dy="15.6">none left:</tspan><tspan x="325.0" dy="15.6">default_action</tspan></text>
<rect x="460" y="60" width="200" height="80" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="560.0" y="96.4" font-size="12" text-anchor="middle"><tspan x="560.0" dy="0.0" font-weight="bold">Does its match hold?</tspan><tspan x="560.0" dy="15.6">no: next rule</tspan></text>
<rect x="700" y="60" width="200" height="80" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="800.0" y="104.2" font-size="12" text-anchor="middle"><tspan x="800.0" dy="0.0" font-weight="bold">Run its action</tspan></text>
<polyline points="190,100 230,100" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="420,100 460,100" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="660,100 700,100" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="940" y="20" width="220" height="60" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="1050.0" y="46.4" font-size="12" text-anchor="middle"><tspan x="1050.0" dy="0.0" font-weight="bold">route</tspan><tspan x="1050.0" dy="15.6">use that outbound</tspan></text>
<rect x="940" y="100" width="220" height="60" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="1050.0" y="126.4" font-size="12" text-anchor="middle"><tspan x="1050.0" dy="0.0" font-weight="bold">block</tspan><tspan x="1050.0" dy="15.6">close, or drop UDP</tspan></text>
<polyline points="900,90 940,50" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="900,110 940,130" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="700" y="220" width="200" height="80" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/><text x="800.0" y="248.6" font-size="12" text-anchor="middle"><tspan x="800.0" dy="0.0" font-weight="bold">sniff</tspan><tspan x="800.0" dy="15.6">learn the name the</tspan><tspan x="800.0" dy="15.6">connection asks for</tspan></text>
<rect x="460" y="220" width="200" height="80" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/><text x="560.0" y="248.6" font-size="12" text-anchor="middle"><tspan x="560.0" dy="0.0" font-weight="bold">resolve</tspan><tspan x="560.0" dy="15.6">look up the domain's</tspan><tspan x="560.0" dy="15.6">addresses</tspan></text>
<polyline points="800,140 800,220" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="760,140 560,220" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="700,260 660,260" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h0)"/>
<polyline points="460,260 325,260 325,140" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h0)"/>
<text x="20" y="342" font-size="12" text-anchor="start" fill="#495057"><tspan x="20" dy="0.0">route and block decide and end the list. sniff and resolve add facts for the rules after them,</tspan><tspan x="20" dy="15.6">then evaluation goes on with the next rule. The destination itself is never changed.</tspan></text>
</g>
