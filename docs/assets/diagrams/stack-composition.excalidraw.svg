<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 470" width="1260" height="470" role="img" aria-label="How the builder composes a stack. Inbound, reading up from the wire: the client connection, the tcp listener, the overlays' WrapServerStream in the connection's goroutine, the proxy server returning the payload and Metadata, then the handler. Proxy outbound, writing down: the proxy client's RequestStream, the overlays' WrapClientStream in stack order, then the tcp dialer to the proxy server.">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>How the builder composes a stack</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1260" height="470" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="20" y="20" width="590" height="430" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="34" y="42" font-size="14" font-weight="bold" fill="#495057">Inbound: read up from the wire</text>
<rect x="630" y="20" width="610" height="430" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="644" y="42" font-size="14" font-weight="bold" fill="#495057">Proxy outbound: written down to the wire</text>
<rect x="40" y="60" width="550" height="56" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="315.0" y="84.4" font-size="12" text-anchor="middle"><tspan x="315.0" dy="0.0" font-weight="bold">handler</tspan><tspan x="315.0" dy="15.6">routes, then relays</tspan></text>
<rect x="40" y="136" width="550" height="56" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="315.0" y="160.4" font-size="12" text-anchor="middle"><tspan x="315.0" dy="0.0" font-weight="bold">proxy server</tspan><tspan x="315.0" dy="15.6">AcceptStream → payload + Metadata</tspan></text>
<polyline points="315,136 315,116" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="40" y="212" width="550" height="56" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="315.0" y="228.6" font-size="12" text-anchor="middle"><tspan x="315.0" dy="0.0" font-weight="bold">overlays</tspan><tspan x="315.0" dy="15.6">WrapServerStream, one per layer,</tspan><tspan x="315.0" dy="15.6">in the connection's goroutine</tspan></text>
<polyline points="315,212 315,192" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="40" y="288" width="550" height="56" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="315.0" y="312.4" font-size="12" text-anchor="middle"><tspan x="315.0" dy="0.0" font-weight="bold">base: tcp listener</tspan><tspan x="315.0" dy="15.6">AcceptStream returns at once</tspan></text>
<polyline points="315,288 315,268" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="40" y="364" width="550" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="315.0" y="396.2" font-size="12" text-anchor="middle"><tspan x="315.0" dy="0.0" font-weight="bold">client connection</tspan></text>
<polyline points="315,364 315,344" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="650" y="60" width="570" height="56" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="935.0" y="84.4" font-size="12" text-anchor="middle"><tspan x="935.0" dy="0.0" font-weight="bold">proxy client</tspan><tspan x="935.0" dy="15.6">RequestStream: sends the request over the stream</tspan></text>
<rect x="650" y="136" width="570" height="56" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="935.0" y="160.4" font-size="12" text-anchor="middle"><tspan x="935.0" dy="0.0" font-weight="bold">overlays</tspan><tspan x="935.0" dy="15.6">WrapClientStream, in stack order</tspan></text>
<polyline points="935,116 935,136" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="650" y="212" width="570" height="56" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="935.0" y="236.4" font-size="12" text-anchor="middle"><tspan x="935.0" dy="0.0" font-weight="bold">base: tcp dialer</tspan><tspan x="935.0" dy="15.6">DialStream(server), resolving through the resolver</tspan></text>
<polyline points="935,192 935,212" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="650" y="288" width="570" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="935.0" y="312.4" font-size="12" text-anchor="middle"><tspan x="935.0" dy="0.0" font-weight="bold">proxy server</tspan><tspan x="935.0" dy="15.6">server:server_port</tspan></text>
<polyline points="935,268 935,288" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<text x="650" y="392" font-size="12" text-anchor="start" fill="#495057"><tspan x="650" dy="0.0">Below the proxy client an address means the proxy server;</tspan><tspan x="650" dy="15.6">above it, the real destination in Metadata. freedom has no proxy client:</tspan><tspan x="650" dy="15.6">its tcp dials each destination.</tspan></text>
</g>
</svg>
