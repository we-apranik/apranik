<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" width="1300" height="600" role="img" aria-label="What ws and httpupgrade put on the wire">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>What ws and httpupgrade put on the wire</title>
<defs></defs>
<rect x="0" y="0" width="1300" height="600" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="20" y="20" width="620" height="500" rx="14" fill="#ebfbee" stroke="#495057" stroke-width="1.5" stroke-dasharray="7 5"/>
<text class="group-label" x="34" y="42" font-size="14" font-weight="bold" fill="#495057">ws: WebSocket (RFC 6455)</text>
<rect x="660" y="20" width="620" height="500" rx="14" fill="#ebfbee" stroke="#495057" stroke-width="1.5" stroke-dasharray="7 5"/>
<text class="group-label" x="674" y="42" font-size="14" font-weight="bold" fill="#495057">httpupgrade: the handshake only</text>
<rect x="40" y="70" width="580" height="90" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="330.0" y="94.6" text-anchor="middle" font-size="13" font-weight="bold">Client: GET /path HTTP/1.1</text>
<text x="330.0" y="110.8" text-anchor="middle" font-size="12">Host, Connection: Upgrade, Upgrade: websocket,</text>
<text x="330.0" y="127.0" text-anchor="middle" font-size="12">Sec-WebSocket-Version: 13, Sec-WebSocket-Key: &lt;random&gt;</text>
<text x="330.0" y="143.2" text-anchor="middle" font-size="12">(+ Sec-WebSocket-Protocol: &lt;early data, base64&gt;)</text>
<rect x="40" y="175" width="580" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="330.0" y="205.8" text-anchor="middle" font-size="13" font-weight="bold">Server: HTTP/1.1 101 Switching Protocols</text>
<text x="330.0" y="222.0" text-anchor="middle" font-size="12">Sec-WebSocket-Accept: base64(SHA-1(key + GUID))</text>
<rect x="40" y="275" width="130" height="70" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="105.0" y="305.8" text-anchor="middle" font-size="13" font-weight="bold">header</text>
<text x="105.0" y="322.0" text-anchor="middle" font-size="12">2-14 bytes</text>
<rect x="175" y="275" width="110" height="70" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="230.0" y="297.7" text-anchor="middle" font-size="13" font-weight="bold">mask key</text>
<text x="230.0" y="313.9" text-anchor="middle" font-size="12">4 bytes,</text>
<text x="230.0" y="330.1" text-anchor="middle" font-size="12">client only</text>
<rect x="290" y="275" width="330" height="70" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="455.0" y="297.7" text-anchor="middle" font-size="13" font-weight="bold">payload</text>
<text x="455.0" y="313.9" text-anchor="middle" font-size="12">XORed with the mask from the client;</text>
<text x="455.0" y="330.1" text-anchor="middle" font-size="12">plain from the server</text>
<rect x="40" y="360" width="580" height="60" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="330.0" y="385.8" text-anchor="middle" font-size="13" font-weight="bold">... one binary frame per write, and more frames</text>
<text x="330.0" y="402.0" text-anchor="middle" font-size="12">ping / pong answered; Close ends both directions</text>
<text x="40" y="452.0" text-anchor="start" font-size="12" font-style="italic" fill="#495057">Works through anything that relays WebSocket, including</text>
<text x="40" y="468.8" text-anchor="start" font-size="12" font-style="italic" fill="#495057">intermediaries that check frames. Costs a header and, from</text>
<text x="40" y="485.6" text-anchor="start" font-size="12" font-style="italic" fill="#495057">the client, masking every byte.</text>
<rect x="680" y="70" width="580" height="90" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="970.0" y="102.7" text-anchor="middle" font-size="13" font-weight="bold">Client: GET /path HTTP/1.1</text>
<text x="970.0" y="118.9" text-anchor="middle" font-size="12">Host, Connection: Upgrade, Upgrade: websocket</text>
<text x="970.0" y="135.1" text-anchor="middle" font-size="12">(no Sec-WebSocket-Key: sing-box servers refuse it)</text>
<rect x="680" y="175" width="580" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="970.0" y="205.8" text-anchor="middle" font-size="13" font-weight="bold">Server: HTTP/1.1 101 Switching Protocols</text>
<text x="970.0" y="222.0" text-anchor="middle" font-size="12">Connection: Upgrade, Upgrade: websocket</text>
<rect x="680" y="275" width="580" height="70" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="970.0" y="305.8" text-anchor="middle" font-size="13" font-weight="bold">payload</text>
<text x="970.0" y="322.0" text-anchor="middle" font-size="12">the proxy&#x27;s bytes, exactly as written</text>
<rect x="680" y="360" width="580" height="60" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="970.0" y="385.8" text-anchor="middle" font-size="13" font-weight="bold">... nothing else: no frames, no masking, no control frames</text>
<text x="970.0" y="402.0" text-anchor="middle" font-size="12">half-close passes through to TCP</text>
<text x="680" y="452.0" text-anchor="start" font-size="12" font-style="italic" fill="#495057">Nothing to pay after the 101. Works through CDNs that relay an</text>
<text x="680" y="468.8" text-anchor="start" font-size="12" font-style="italic" fill="#495057">upgraded connection without checking frames (Cloudflare, in</text>
<text x="680" y="485.6" text-anchor="start" font-size="12" font-style="italic" fill="#495057">practice). With pipeline, the payload follows the request at once.</text>
<text x="20" y="567.0" text-anchor="start" font-size="12" font-style="italic" fill="#495057">Both exist to pass CDNs and HTTP reverse proxies; neither encrypts. Put tls below them, or let the CDN terminate TLS.</text>
</g></svg>
