<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="A selector group: it has no probes. It starts on its first member and changes only when a person picks another through an API, such as the Clash API's PUT /proxies/{name}. A switch closes the live connections of the previous member, a failing chosen member fails the connection, and the choice is not saved.">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>How a selector group chooses</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1100" height="330" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="220" y="20" width="560" height="290" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="234" y="42" font-size="14" font-weight="bold" fill="#495057">selector group: no probes</text>
<rect x="800" y="20" width="280" height="290" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/><text x="814" y="42" font-size="14" font-weight="bold" fill="#495057">Nothing automatic</text>
<rect x="20" y="120" width="170" height="80" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="105.0" y="156.4" font-size="12" text-anchor="middle"><tspan x="105.0" dy="0.0" font-weight="bold">routing rule</tspan><tspan x="105.0" dy="15.6">route to the group</tspan></text>
<rect x="240" y="170" width="160" height="70" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="320.0" y="201.4" font-size="12" text-anchor="middle"><tspan x="320.0" dy="0.0" font-weight="bold">auto</tspan><tspan x="320.0" dy="15.6">a urltest group</tspan></text>
<rect x="420" y="170" width="160" height="70" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="500.0" y="201.4" font-size="12" text-anchor="middle"><tspan x="500.0" dy="0.0" font-weight="bold">server-a</tspan><tspan x="500.0" dy="15.6">chosen</tspan></text>
<rect x="600" y="170" width="160" height="70" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="680.0" y="209.2" font-size="12" text-anchor="middle"><tspan x="680.0" dy="0.0" font-weight="bold">server-b</tspan></text>
<rect x="240" y="60" width="520" height="60" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/><text x="500.0" y="86.4" font-size="12" text-anchor="middle"><tspan x="500.0" dy="0.0" font-weight="bold">A person picks a member through an API</tspan><tspan x="500.0" dy="15.6">PUT /proxies/{name} with {"name": "server-a"}</tspan></text>
<polyline points="500,120 500,170" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<text x="240" y="267" font-size="12" text-anchor="start" fill="#495057"><tspan x="240" dy="0.0">It starts on the first member. A switch closes the live connections of</tspan><tspan x="240" dy="15.6">the previous member. A failing chosen member fails the connection.</tspan></text>
<polyline points="190,160 220,160" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<text x="816" y="72" font-size="12" text-anchor="start"><tspan x="816" dy="0.0">No probe, no tolerance.</tspan><tspan x="816" dy="15.6">No switch on failure.</tspan><tspan x="816" dy="15.6">The choice is not saved:</tspan><tspan x="816" dy="15.6">every start begins on the</tspan><tspan x="816" dy="15.6">first member.</tspan></text>
</g>
</svg>
