<rect x="320" y="40" width="260" height="100" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="450.0" y="78.6" font-size="12" text-anchor="middle"><tspan x="450.0" dy="0.0" font-weight="bold">2. One folder</tspan><tspan x="450.0" dy="15.6">module/&lt;kind&gt;/&lt;name&gt;/</tspan><tspan x="450.0" dy="15.6">settings and implementation</tspan></text>
<rect x="620" y="40" width="260" height="100" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="750.0" y="86.4" font-size="12" text-anchor="middle"><tspan x="750.0" dy="0.0" font-weight="bold">3. Tests in that folder</tspan><tspan x="750.0" dy="15.6">real bytes, no core</tspan></text>
<rect x="620" y="190" width="260" height="100" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="750.0" y="236.4" font-size="12" text-anchor="middle"><tspan x="750.0" dy="0.0" font-weight="bold">4. One registry line</tspan><tspan x="750.0" dy="15.6">core/registry/default.go</tspan></text>
<rect x="320" y="190" width="260" height="100" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="450.0" y="228.6" font-size="12" text-anchor="middle"><tspan x="450.0" dy="0.0" font-weight="bold">5. Used by name</tspan><tspan x="450.0" dy="15.6">"type": "&lt;name&gt;",</tspan><tspan x="450.0" dy="15.6">checked by apranik check</tspan></text>
