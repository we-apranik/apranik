<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-label="From a new technique to a deployed module">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>From a new technique to a deployed module</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1240" height="470" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="970" y="40" width="250" height="290" rx="14" fill="#fff5f5" stroke="#495057" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="984" y="62" font-size="14" font-weight="bold" fill="#495057">Not touched</text>
<polyline points="290,95.0 340,95.0" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="600,95.0 650,95.0" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="780.0,150 780.0,220" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="650,275.0 600,275.0" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="340,275.0 290,275.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#h0)"/>
<rect x="30" y="40" width="260" height="110" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="160.0" y="81.7" text-anchor="middle" font-size="15" font-weight="bold">1. A new technique</text>
<text x="160.0" y="99.5" text-anchor="middle" font-size="13">a researcher finds a way</text>
<text x="160.0" y="117.0" text-anchor="middle" font-size="13">past a censor</text>
<rect x="340" y="40" width="260" height="110" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="470.0" y="73.0" text-anchor="middle" font-size="15" font-weight="bold">2. One folder: module/&lt;name&gt;/</text>
<text x="470.0" y="90.7" text-anchor="middle" font-size="13">settings type, Validate, Warnings</text>
<text x="470.0" y="108.3" text-anchor="middle" font-size="13">the implementation</text>
<text x="470.0" y="125.8" text-anchor="middle" font-size="13">New&lt;Kind&gt;Module() constructor</text>
<rect x="650" y="40" width="260" height="110" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="780.0" y="81.7" text-anchor="middle" font-size="15" font-weight="bold">3. Tests in that folder</text>
<text x="780.0" y="99.5" text-anchor="middle" font-size="13">real bytes over net.Pipe or</text>
<text x="780.0" y="117.0" text-anchor="middle" font-size="13">loopback; never import core</text>
<rect x="650" y="220" width="260" height="110" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="780.0" y="261.7" text-anchor="middle" font-size="15" font-weight="bold">4. One line in the registry</text>
<text x="780.0" y="279.5" text-anchor="middle" font-size="13">core/registry/default.go:</text>
<text x="780.0" y="297.0" text-anchor="middle" font-size="13">Register&lt;Kind&gt;(name.New...Module)</text>
<rect x="340" y="220" width="260" height="110" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="470.0" y="261.7" text-anchor="middle" font-size="15" font-weight="bold">5. Use it by name</text>
<text x="470.0" y="279.5" text-anchor="middle" font-size="13">&quot;type&quot;: &quot;&lt;name&gt;&quot; in a config file;</text>
<text x="470.0" y="297.0" text-anchor="middle" font-size="13">apranik check refuses mistakes</text>
<rect x="30" y="220" width="260" height="110" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 6"/>
<text x="160.0" y="261.7" text-anchor="middle" font-size="15" font-weight="bold">6. Ship (planned)</text>
<text x="160.0" y="279.5" text-anchor="middle" font-size="13">a release of the apranik binary;</text>
<text x="160.0" y="297.0" text-anchor="middle" font-size="13">clients and panels pick it up</text>
<text x="990" y="95.0" text-anchor="start" font-size="13" fill="#1e1e1e">spec/ (the contract)</text>
<text x="990" y="113.2" text-anchor="start" font-size="13" fill="#1e1e1e">core/builder</text>
<text x="990" y="131.4" text-anchor="start" font-size="13" fill="#1e1e1e">core/inbound, core/outbound</text>
<text x="990" y="149.6" text-anchor="start" font-size="13" fill="#1e1e1e">every other module</text>
<text x="990" y="167.8" text-anchor="start" font-size="13" fill="#1e1e1e">the config parser</text>
<text x="990" y="210.0" text-anchor="start" font-size="12" font-style="italic" fill="#c92a2a">Needing any of these is a</text>
<text x="990" y="226.8" text-anchor="start" font-size="12" font-style="italic" fill="#c92a2a">design failure: raise it,</text>
<text x="990" y="243.6" text-anchor="start" font-size="12" font-style="italic" fill="#c92a2a">do not work around it.</text>
<text x="30" y="390.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1e1e1e">Adding a module = a new folder under module/ + one line in core/registry/default.go.</text>
<text x="30" y="418.0" text-anchor="start" font-size="13" fill="#495057">The module imports only spec (and config/types for shared JSON values), so its tests prove the contract alone is enough.</text>
</g></svg>
