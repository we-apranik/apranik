<text x="956" y="92" font-size="12" text-anchor="start"><tspan x="956" dy="0.0">spec, the contract</tspan><tspan x="956" dy="15.6">core/builder</tspan><tspan x="956" dy="15.6">core's inbound and outbound</tspan><tspan x="956" dy="15.6">every other module</tspan><tspan x="956" dy="15.6">the config parser</tspan><tspan x="956" dy="15.6"> </tspan><tspan x="956" dy="15.6">Needing any of these means</tspan><tspan x="956" dy="15.6">the contract lacks a concept:</tspan><tspan x="956" dy="15.6">raise it.</tspan></text>
