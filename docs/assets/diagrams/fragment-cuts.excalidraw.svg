<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="What fragment does to a ClientHello: without it the whole ClientHello leaves in one packet and a DPI box reads the server name from it. With fragment the same bytes leave in several packets, with a cut inside the name, so DPI that inspects each packet alone cannot read it, while the server's TCP joins the packets back together.">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>What fragment does to a ClientHello</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1180" height="430" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="20" y="20" width="1140" height="150" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/><text x="34" y="42" font-size="14" font-weight="bold" fill="#495057">Without fragment</text>
<rect x="20" y="200" width="1140" height="215" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="34" y="222" font-size="14" font-weight="bold" fill="#495057">With fragment (tcp_packets)</text>
<rect x="40" y="70" width="520" height="70" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="300.0" y="101.4" font-size="12" text-anchor="middle"><tspan x="300.0" dy="0.0" font-weight="bold">One packet: TLS ClientHello</tspan><tspan x="300.0" dy="15.6">... server_name = blocked.example ...</tspan></text>
<rect x="680" y="70" width="250" height="70" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="805.0" y="101.4" font-size="12" text-anchor="middle"><tspan x="805.0" dy="0.0" font-weight="bold">DPI reads the name</tspan><tspan x="805.0" dy="15.6">and can block the connection</tspan></text>
<polyline points="560,105 680,105" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<rect x="40" y="250" width="175" height="60" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="127.5" y="276.4" font-size="12" text-anchor="middle"><tspan x="127.5" dy="0.0" font-weight="bold">packet 1</tspan><tspan x="127.5" dy="15.6">... server_na</tspan></text>
<rect x="225" y="250" width="175" height="60" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="312.5" y="276.4" font-size="12" text-anchor="middle"><tspan x="312.5" dy="0.0" font-weight="bold">packet 2</tspan><tspan x="312.5" dy="15.6">me = blocked.ex</tspan></text>
<rect x="410" y="250" width="175" height="60" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="497.5" y="276.4" font-size="12" text-anchor="middle"><tspan x="497.5" dy="0.0" font-weight="bold">packet 3</tspan><tspan x="497.5" dy="15.6">ample ...</tspan></text>
<rect x="680" y="250" width="250" height="70" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="805.0" y="281.4" font-size="12" text-anchor="middle"><tspan x="805.0" dy="0.0" font-weight="bold">DPI that inspects each</tspan><tspan x="805.0" dy="15.6">packet alone sees no name</tspan></text>
<rect x="950" y="250" width="190" height="70" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="1045.0" y="281.4" font-size="12" text-anchor="middle"><tspan x="1045.0" dy="0.0" font-weight="bold">The server's TCP joins</tspan><tspan x="1045.0" dy="15.6">the packets back</tspan></text>
<polyline points="585,280 680,285" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<polyline points="930,285 950,285" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<text x="40" y="347" font-size="12" text-anchor="start" fill="#495057"><tspan x="40" dy="0.0">Nothing is decrypted and no key is involved: the ClientHello is the one TLS message sent in the clear,</tspan><tspan x="40" dy="15.6">and fragment only cuts it. The cut points are illustrative; piece_sizes, max_pieces and split_sni decide the real ones.</tspan></text>
</g>
</svg>
