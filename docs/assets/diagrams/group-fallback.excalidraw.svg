<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="A fallback group: every interval it probes each member. Members are listed in order of preference; server-a failed its probe, so connections use server-b, the first member that passed. server-a is used again as soon as its probe passes; members that failed are still tried, last.">
<!-- svg-source:excalidraw -->
<metadata><!-- payload-type:application/vnd.excalidraw+json --><!-- payload-version:2 --><!-- payload-start --><!-- payload-end --></metadata>
<title>How a fallback group chooses</title>
<defs><marker id="h0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1100" height="360" rx="12" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
<rect x="220" y="20" width="560" height="320" rx="14" fill="#f3f0ff" stroke="#495057" stroke-width="1.5"/><text x="234" y="42" font-size="14" font-weight="bold" fill="#495057">fallback group: members in list order</text>
<rect x="800" y="20" width="280" height="320" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/><text x="814" y="42" font-size="14" font-weight="bold" fill="#495057">Order a connection tries</text>
<rect x="20" y="140" width="170" height="80" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="105.0" y="176.4" font-size="12" text-anchor="middle"><tspan x="105.0" dy="0.0" font-weight="bold">routing rule</tspan><tspan x="105.0" dy="15.6">route to the group</tspan></text>
<rect x="240" y="60" width="520" height="60" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5"/><text x="500.0" y="94.2" font-size="12" text-anchor="middle"><tspan x="500.0" dy="0.0" font-weight="bold">every interval: one HTTP request through each member, pass or fail</tspan></text>
<rect x="240" y="180" width="160" height="70" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="320.0" y="211.4" font-size="12" text-anchor="middle"><tspan x="320.0" dy="0.0" font-weight="bold">1. server-a</tspan><tspan x="320.0" dy="15.6">probe failed</tspan></text>
<polyline points="320,120 320,180" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h0)"/>
<rect x="420" y="180" width="160" height="70" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/><text x="500.0" y="211.4" font-size="12" text-anchor="middle"><tspan x="500.0" dy="0.0" font-weight="bold">2. server-b</tspan><tspan x="500.0" dy="15.6">passed: used</tspan></text>
<polyline points="500,120 500,180" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h0)"/>
<rect x="600" y="180" width="160" height="70" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="680.0" y="211.4" font-size="12" text-anchor="middle"><tspan x="680.0" dy="0.0" font-weight="bold">3. direct</tspan><tspan x="680.0" dy="15.6">passed</tspan></text>
<polyline points="680,120 680,180" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#h0)"/>
<text x="240" y="280" font-size="12" text-anchor="start" fill="#495057"><tspan x="240" dy="0.0">The first member in the list whose probe passed is used.</tspan><tspan x="240" dy="15.6">server-a is used again as soon as its probe passes.</tspan></text>
<polyline points="190,180 220,180" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#h0)"/>
<text x="816" y="72" font-size="12" text-anchor="start"><tspan x="816" dy="0.0">1. members that passed,</tspan><tspan x="816" dy="15.6">    in list order</tspan><tspan x="816" dy="15.6">2. members that failed,</tspan><tspan x="816" dy="15.6">    in list order</tspan><tspan x="816" dy="15.6"> </tspan><tspan x="816" dy="15.6">The first that connects is used.</tspan><tspan x="816" dy="15.6">If every probe fails: list order.</tspan></text>
</g>
</svg>
