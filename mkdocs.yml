site_name: Apranik
site_description: An embeddable, open-source proxy core for censorship circumvention.
site_url: https://we-apranik.github.io/apranik/
repo_url: https://github.com/we-apranik/apranik
repo_name: we-apranik/apranik
edit_uri: edit/main/docs/
docs_dir: docs

validation:
  links:
    anchors: warn

exclude_docs: |
  _plan.md
  _report.md
  context/
  plans/
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  icon:
    logo: material/shield-lock-outline
    repo: fontawesome/brands/github
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/home.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/we-apranik/apranik

plugins:
  - search
  - privacy
  - offline
  - social
  - glightbox
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - llmstxt:
      markdown_description: An embeddable, open-source proxy core for censorship circumvention, written in Go.
      sections:
        Get started:
          - get-started/*.md
        Guides:
          - guides/*.md
        Configuration:
          - configuration/*.md
          - configuration/*/*.md
        Concepts:
          - concepts/*.md
        Contribute:
          - contribute/*.md

markdown_extensions:
  - tables
  - md_in_html
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - github-callouts

nav:
  - Home: index.md
  - Get started:
      - What is Apranik: get-started/overview.md
      - Install and run: get-started/install.md
      - First configuration: get-started/first-configuration.md
      - FAQ: get-started/faq.md
      - Security: get-started/security.md
  - Guides:
      - guides/index.md
      - Run Trojan over TLS: guides/trojan-over-tls.md
      - Run Trojan behind a CDN: guides/trojan-over-websocket-cdn.md
      - Run a local proxy: guides/local-proxy.md
      - Hide the server name: guides/hide-the-server-name.md
  - Configuration:
      - configuration/index.md
      - Log: configuration/log.md
      - Inbound:
          - configuration/inbound/index.md
          - Mixed: configuration/inbound/mixed.md
          - Users: configuration/inbound/users.md
      - Outbound:
          - configuration/outbound/index.md
          - Freedom: configuration/outbound/freedom.md
          - URLTest: configuration/outbound/urltest.md
          - Fallback: configuration/outbound/fallback.md
          - Selector: configuration/outbound/selector.md
      - Datasets: configuration/datasets.md
      - DNS:
          - configuration/dns/index.md
          - DNS server: configuration/dns/server.md
          - DNS rule: configuration/dns/rule.md
      - Routing:
          - configuration/routing/index.md
          - Rule: configuration/routing/rule.md
          - Action: configuration/routing/action.md
          - Sniffing: configuration/routing/sniffing.md
      - Stats:
          - configuration/stats/index.md
          - Counters: configuration/stats/counters.md
      - API:
          - configuration/api/index.md
          - Clash API: configuration/api/clash.md
          - Clash API endpoints: configuration/api/clash-endpoints.md
      - Shared:
          - Transport:
              - configuration/transport/index.md
              - TCP: configuration/transport/tcp.md
              - UDP: configuration/transport/udp.md
              - TLS: configuration/transport/tls.md
              - WebSocket: configuration/transport/ws.md
              - HTTPUpgrade: configuration/transport/httpupgrade.md
              - Fragment: configuration/transport/fragment.md
              - PROXY protocol: configuration/transport/proxy_protocol.md
              - Client address behind a proxy: configuration/transport/original_source_ip.md
          - Protocol:
              - SOCKS5: configuration/protocol/socks5.md
              - HTTP: configuration/protocol/http.md
              - Trojan: configuration/protocol/trojan.md
              - VLESS: configuration/protocol/vless.md
          - Mux.Cool: configuration/shared/muxcool.md
          - Proxy request timing: configuration/shared/proxy-request-timing.md
          - Probe: configuration/shared/probe.md
          - Timeouts: configuration/shared/timeouts.md
  - Concepts:
      - concepts/architecture.md
      - concepts/request-lifecycle.md
      - Mux.Cool on the wire: concepts/mux-cool.md
      - concepts/glossary.md
  - Contribute:
      - contribute/index.md
      - Your first module: contribute/first-module.md
      - Add a module:
          - Base stream transport: contribute/base-transport.md
          - Overlay transport: contribute/overlay-transport.md
          - Proxy protocol: contribute/proxy-protocol.md
          - Sniffer: contribute/sniffer.md
          - DNS server: contribute/dns-server.md
          - API module: contribute/api-module.md
      - Tests: contribute/tests.md
      - Pull requests: contribute/pull-requests.md
      - Practices: contribute/practices.md
      - Performance:
          - contribute/performance.md
          - contribute/performance-log.md
      - Good first issues: contribute/good-first-issues.md
      - Editing the docs: contribute/docs.md
